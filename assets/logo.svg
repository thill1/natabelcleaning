<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Natabel Pristine Cleaning mark">
  <defs>
    <linearGradient id="natabelBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="natabelGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C547"/>
      <stop offset="1" stop-color="#9A7209"/>
    </linearGradient>
    <radialGradient id="bubbleGlow" cx="30%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#natabelBlack)"/>
  <!-- Monogram N -->
  <path d="M18 46V18h4.6l15.6 19.2V18H43v28h-4.6L22.8 26.8V46H18z" fill="#FFFFFF"/>
