  <ellipse cx="45.5" cy="13" rx="2.8" ry="1.6" fill="#FFFFFF" opacity="0.75" transform="rotate(-25 45.5 13)"/>
  <!-- Small bubbles -->
  <circle cx="52" cy="28" r="4" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.7"/>
  <circle cx="51" cy="27" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="14" cy="14" r="3" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.45"/>
  <!-- Gold accent line -->
  <path d="M14 50c9 3.2 27 3.2 36 0" stroke="url(#natabelGold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
