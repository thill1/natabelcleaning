<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Placeholder  kitchen after cleaning">
  <defs>
    <linearGradient id="wallAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F2EC"/>
    </linearGradient>
    <linearGradient id="counterAfter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
    <linearGradient id="brassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#F8F6F2"/>
  <rect width="1600" height="720" fill="url(#wallAfter)"/>

  <!-- Upper cabinets -->
  <g fill="#0A0A0A">
    <rect x="80" y="70" width="420" height="170" rx="6"/>
    <rect x="530" y="70" width="540" height="170" rx="6"/>
    <rect x="1100" y="70" width="420" height="170" rx="6"/>
    <rect x="95" y="95" width="180" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="300" y="95" width="180" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="545" y="95" width="250" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="820" y="95" width="230" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="1115" y="95" width="180" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="1320" y="95" width="180" height="120" rx="4" fill="#1A1A1A"/>
    <rect x="110" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="315" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="560" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="835" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="1130" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="1335" y="210" width="90" height="18" rx="3" fill="url(#brassShine)"/>
  </g>

  <!-- Window -->
  <rect x="620" y="280" width="360" height="220" rx="8" fill="#C8DCE8"/>
  <rect x="640" y="300" width="150" height="180" fill="#A8C8DC" opacity="0.65"/>
  <rect x="810" y="300" width="150" height="180" fill="#A8C8DC" opacity="0.65"/>
  <rect x="798" y="280" width="4" height="220" fill="#0A0A0A"/>
  <rect x="620" y="388" width="360" height="4" fill="#0A0A0A"/>

  <!-- Clean backsplash -->
  <rect x="80" y="520" width="1440" height="110" fill="#FFFFFF"/>
  <rect x="80" y="520" width="1440" height="4" fill="#E5E5E5"/>

  <!-- Shiny counter -->
  <rect x="60" y="620" width="1480" height="38" fill="url(#counterAfter)"/>
  <rect x="60" y="628" width="1480" height="8" fill="#FFFFFF" opacity="0.85"/>
  <rect x="60" y="658" width="1480" height="14" fill="#E8E4DC"/>

  <!-- Clean sink -->
  <rect x="760" y="575" width="280" height="52" rx="8" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="2"/>
  <rect x="780" y="590" width="240" height="30" rx="6" fill="#ECECEC"/>
  <ellipse cx="900" cy="605" rx="55" ry="8" fill="#FFFFFF" opacity="0.9"/>
  <path d="M860 600 Q900 585 940 600" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Clean stovetop -->
  <rect x="1180" y="565" width="260" height="58" rx="6" fill="#1A1A1A"/>
  <circle cx="1240" cy="594" r="22" fill="#2A2A2A" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="1310" cy="594" r="22" fill="#2A2A2A" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="1380" cy="594" r="22" fill="#2A2A2A" stroke="#D4AF37" stroke-width="2"/>
  <rect x="1220" y="548" width="180" height="6" rx="3" fill="#FFFFFF" opacity="0.15"/>

  <!-- Lower cabinets -->
  <g fill="#0A0A0A">
    <rect x="80" y="672" width="420" height="250" rx="6"/>
    <rect x="530" y="672" width="540" height="250" rx="6"/>
    <rect x="1100" y="672" width="420" height="250" rx="6"/>
    <rect x="110" y="710" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="560" y="710" width="90" height="18" rx="3" fill="url(#brassShine)"/>
    <rect x="1130" y="710" width="90" height="18" rx="3" fill="url(#brassShine)"/>
  </g>

  <!-- Floor -->
  <rect y="922" width="1600" height="78" fill="#EDE8DF"/>
  <rect y="922" width="1600" height="20" fill="#FFFFFF" opacity="0.35"/>

  <!-- Sparkles -->
  <g fill="url(#sparkle)">
    <circle cx="320" cy="600" r="18"/>
    <circle cx="1050" cy="590" r="14"/>
    <circle cx="1360" cy="610" r="16"/>
    <circle cx="680" cy="545" r="10"/>
  </g>
  <g stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M320 582 L320 618 M302 600 L338 600"/>
    <path d="M1050 574 L1050 606 M1036 590 L1064 590"/>
    <path d="M1360 594 L1360 626 M1346 610 L1374 610"/>
  </g>

  <g opacity="0.72">
    <rect x="48" y="48" width="220" height="44" rx="22" fill="url(#brassShine)"/>
    <text x="158" y="78" text-anchor="middle" fill="#0A0A0A" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PLACEHOLDER</text>
  </g>
</svg>
